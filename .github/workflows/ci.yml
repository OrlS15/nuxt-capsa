name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Every Monday, and on demand: the tests against the latest release of each package capsa generates code for.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      - name: Lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.3-alpine
        env:
          POSTGRES_PASSWORD: capsa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: capsa
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcapsa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24.20.0

      - run: npm i -g --force corepack@latest && corepack enable

      - name: Install dependencies
        run: npx nypm@latest i

      # A failure here, and not on main, is a new release of a peer: fix capsa, or narrow its peerDependencies.
      # drizzle is on the `rc` tag until v1 is out: then it is `latest`, like the others.
      - name: Upgrade the peers to their latest release
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm up -r drizzle-orm@rc drizzle-kit@rc better-auth@latest @better-auth/drizzle-adapter@latest files-sdk@latest

      - name: Playground prepare
        run: npm run dev:prepare

      - name: Test types
        run: npm run test:types

      - name: Test
        run: npm run test
        env:
          CAPSA_TEST_POSTGRES_URL: postgres://postgres:capsa@127.0.0.1:5432/postgres
          CAPSA_TEST_MYSQL_URL: mysql://root:capsa@127.0.0.1:3306/mysql
